<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Isle 英語島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@500;700;800&display=swap">
<style>
/* 這段在做什麼：整體配色與字體（想換顏色，改這一區就好） */
/* 版面概念：夜裡的小島地圖當首頁；上課頁上半給學生看、下半是老師評分區；報告是一張可以截圖給家長的紙卡 */
:root{
  --sea:#0f2b39; --sea-deep:#0a202c; --sea-line:#24536a;
  --card:#15384a; --card-2:#1c4558; --line:#2e5d72;
  --ink:#f6f0e4; --muted:#a9c0c8;
  --sand:#ecd09b; --grass:#4c875a; --grass-2:#3a6e48;
  --pumpkin:#ff8a3d; --pumpkin-ink:#2b1405; --moon:#ffe6a1;
  --r1:#ff9d8b; --r2:#ffd166; --r3:#7fd6a0; --rec:#ff5d5d;
  --paper:#fffaf0; --paper-ink:#25313a; --paper-muted:#65737c; --paper-line:#eadfc9; --paper-soft:#f7efdf;
  --f-display:"Grandstander","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-learn:"Andika","Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-ui:system-ui,-apple-system,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sea);color:var(--ink)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
ul,ol{margin:0;padding-left:1.2em}
a{color:var(--moon)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--moon);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.sm{font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650}
.spacer{flex:1 1 auto}

/* 這段在做什麼：按鈕和輸入框的共同樣式 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);font-weight:650;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--pumpkin);color:var(--pumpkin-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn.armed{background:var(--rec);color:var(--pumpkin-ink);border-color:transparent}
.btn svg{width:18px;height:18px;flex:none}
.linkish{background:none;border:0;padding:0;color:var(--moon);text-decoration:underline;cursor:pointer;font-size:14px}
input[type=text],input[type=url],select,textarea{background:var(--sea-deep);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:90px;resize:vertical;line-height:1.5}
label{font-size:13px;color:var(--muted);font-weight:600}

/* 這段在做什麼：最上面那一條（島名、學生、存檔狀態） */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--ink)}
.brand small{font-family:var(--f-ui);font-weight:500;font-size:13px;color:var(--muted)}
.brand svg{width:34px;height:34px}
.tb-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-weight:700}
.who-dot{width:10px;height:10px;border-radius:50%;background:var(--pumpkin)}
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--r2);border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:15px}
.banner b{color:var(--r2)}

/* 這段在做什麼：登入畫面 */
.login{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:center;min-height:60vh}
.login h1{font-family:var(--f-display);font-size:clamp(34px,5vw,54px);font-weight:800;margin:6px 0 10px}
.lede{font-size:17px;color:var(--muted);max-width:34em;margin-bottom:20px}
.field{display:flex;gap:10px;flex-wrap:wrap}
.field input{flex:1 1 220px;min-width:0;font-size:18px}
.roster{margin-top:22px}
.roster .label{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;font-size:16px}
.chip-btn:hover{border-color:var(--pumpkin)}
.mic-test{margin-top:26px;padding-top:18px;border-top:1px dashed var(--line);display:grid;gap:10px}
.mic-test .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:820px){.login{grid-template-columns:1fr;min-height:0}}

/* 這段在做什麼：島嶼地圖 */
.map{position:relative;aspect-ratio:1000/620;width:100%;max-width:100%;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--sea-deep)}
.map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.f-sea{fill:var(--sea-deep)} .f-moon{fill:var(--moon)} .stop-moon{stop-color:var(--moon)}
.island{fill:var(--grass);stroke:var(--sand);stroke-width:30;stroke-linejoin:round;paint-order:stroke}
.s-wave{fill:none;stroke:var(--sea-line);stroke-width:3;stroke-linecap:round}
.f-lagoon{fill:var(--sea);stroke:var(--sand);stroke-width:8}
.f-tree{fill:var(--grass-2)} .f-sandc{fill:var(--sand)} .f-mtn{fill:var(--grass-2)} .f-snow{fill:var(--ink)}
.f-light{fill:var(--ink)} .f-stripe{fill:var(--pumpkin)} .f-beam{fill:var(--moon);opacity:.16}
.f-pumpkin{fill:var(--pumpkin)} .s-path{fill:none;stroke:var(--sand);stroke-width:4;stroke-dasharray:2 12;stroke-linecap:round;opacity:.75}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:6px;color:var(--ink)}
.pin .dot{width:20px;height:20px;border-radius:50%;background:var(--muted);border:3px solid var(--sea-deep)}
.pin.open .dot{background:var(--pumpkin)}
.pin .label{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.15;background:color-mix(in srgb,var(--sea-deep) 82%,transparent);padding:4px 10px;border-radius:10px;white-space:nowrap;text-align:center}
.pin .label small{display:block;font-family:var(--f-ui);font-size:11px;font-weight:600;color:var(--muted)}
.pin[aria-pressed="true"] .label{background:var(--pumpkin);color:var(--pumpkin-ink)}
.pin[aria-pressed="true"] .label small{color:var(--pumpkin-ink)}
.pin.open .dot{animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pumpkin) 60%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
@media (max-width:620px){.pin .label{font-size:12px;padding:2px 6px}.pin .label small{display:none}.pin .dot{width:14px;height:14px}}
.map.static .pin{pointer-events:none}

.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3.6vw,38px)}

/* 這段在做什麼：地圖下方的區域介紹與課程卡 */
.zone-panel{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,3vw,28px)}
.zp-head{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.zp-head h2{font-family:var(--f-display);font-size:26px}
.status{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.status.on{background:var(--pumpkin);border-color:transparent;color:var(--pumpkin-ink)}
.lesson-card{display:grid;gap:18px}
.lc-title{font-family:var(--f-display);font-size:clamp(24px,3vw,32px);font-weight:800}
.lc-title span{font-family:var(--f-ui);font-size:.6em;font-weight:600;color:var(--muted);margin-left:8px}
.lc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.lc-grid>div{background:var(--sea-deep);border-radius:14px;padding:14px 16px;min-width:0}
.lc-grid h3{font-size:14px;color:var(--moon);margin-bottom:8px;letter-spacing:.04em}
.lc-grid li{margin-bottom:4px}
.flow li span{color:var(--muted);font-size:13px}
.lc-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.plan-list{display:grid;gap:6px;margin-top:6px}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:18px}
.zone-card{text-align:left;background:var(--sea-deep);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:6px;color:var(--ink)}
.zone-card[aria-pressed="true"]{border-color:var(--pumpkin)}
.zone-card b{font-family:var(--f-display);font-size:18px}

/* 這段在做什麼：上課畫面上方（課名、糖果數、計時） */
.lesson-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.lh-left{display:flex;gap:14px;align-items:center;min-width:0}
.lh-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lesson-title{font-family:var(--f-display);font-size:clamp(22px,3vw,30px);font-weight:800}
.lesson-title .zh{font-family:var(--f-ui);font-size:.6em;color:var(--muted);font-weight:600}
.counter{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 16px 4px 10px;font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--pumpkin);font-variant-numeric:tabular-nums}
.counter svg{width:34px;height:22px}
.counter.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;min-width:54px;text-align:center}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin:16px 0 12px;scrollbar-width:thin}
.tab{flex:0 0 auto;display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 14px 8px 10px;text-align:left;color:var(--ink)}
.tab-n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sea-deep);font-weight:800;font-size:13px}
.tab-t{display:grid;line-height:1.25}
.tab-t b{font-size:15px}
.tab .prog{font-size:12px;color:var(--muted)}
.tab[aria-current="true"]{background:var(--pumpkin);color:var(--pumpkin-ink);border-color:transparent}
.tab[aria-current="true"] .prog{color:var(--pumpkin-ink)}
.tab[aria-current="true"] .tab-n{background:var(--pumpkin-ink);color:var(--pumpkin)}
.tab.done .tab-n{background:var(--r3);color:var(--pumpkin-ink)}

/* 這段在做什麼：給學生看的題目卡 */
.stage{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,3vw,30px)}
.stage-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:18px}
.stage-title{font-family:var(--f-display);font-size:24px;font-weight:800;margin:2px 0 4px}
.stage-intro{color:var(--muted);font-family:var(--f-learn);font-size:17px}
.dots{display:flex;flex-wrap:wrap;gap:6px;max-width:100%}
.dotb{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--sea-deep);font-weight:700;font-size:13px;color:var(--muted)}
.dotb.r1{background:var(--r1);color:var(--pumpkin-ink);border-color:transparent}
.dotb.r2{background:var(--r2);color:var(--pumpkin-ink);border-color:transparent}
.dotb.r3{background:var(--r3);color:var(--pumpkin-ink);border-color:transparent}
.dotb[aria-current="true"]{outline:3px solid var(--ink);outline-offset:1px}
.prompt{font-family:var(--f-learn);font-size:clamp(25px,3.4vw,36px);line-height:1.3;font-weight:700;margin:6px 0 14px;text-wrap:balance}
.prompt.sm{font-size:clamp(21px,2.6vw,28px)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.hint{font-family:var(--f-learn);font-size:20px;background:var(--sea-deep);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.follow{font-size:15px;color:var(--muted);margin-top:4px}
.tag{display:inline-block;font-size:12px;font-weight:700;background:var(--sea-deep);border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin-right:8px;color:var(--moon)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:1fr}}

/* 這段在做什麼：看圖說說的街景（用 emoji 拼成） */
.scene{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;border-radius:16px;overflow:hidden;background:linear-gradient(var(--sea-deep),var(--card-2));border:1px solid var(--line);container-type:inline-size}
.scene .moon{position:absolute;right:20%;top:8%;width:10%;aspect-ratio:1;border-radius:50%;background:var(--moon);box-shadow:0 0 40px color-mix(in srgb,var(--moon) 55%,transparent)}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:24%;background:var(--grass-2)}
.se{position:absolute;transform:translate(-50%,-50%);line-height:1;z-index:1}
.se.s{font-size:22px;font-size:6cqw} .se.m{font-size:30px;font-size:8cqw} .se.l{font-size:38px;font-size:10cqw} .se.xl{font-size:60px;font-size:17cqw}

/* 這段在做什麼：單字卡 */
.word{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);gap:24px;align-items:start}
.word-pic{font-size:clamp(80px,12vw,140px);line-height:1;text-align:center;background:var(--sea-deep);border-radius:20px;padding:20px 10px}
.word-w{font-family:var(--f-learn);font-size:clamp(36px,5vw,56px);font-weight:700;line-height:1.1;margin:4px 0 8px}
.word-def{font-family:var(--f-learn);font-size:20px;margin-bottom:12px}
.zh-gloss{font-size:22px;font-weight:700;color:var(--moon);margin-bottom:12px}
.task{font-family:var(--f-learn);font-size:18px;color:var(--moon);margin:4px 0 10px}
@media (max-width:620px){.word{grid-template-columns:1fr}.word-pic{padding:12px}}

/* 這段在做什麼：麥克風按鈕和電腦聽到的結果 */
.mic{display:grid;gap:10px;margin-top:6px}
.mic-btn{display:inline-flex;align-items:center;gap:12px;justify-self:start;min-height:56px;padding:10px 22px 10px 14px;border-radius:999px;border:0;background:var(--pumpkin);color:var(--pumpkin-ink);font-size:18px;font-weight:800}
.mic-btn .mi{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--pumpkin-ink);color:var(--pumpkin)}
.mic-btn .mi svg{width:20px;height:20px}
.mic-btn.on{background:var(--rec)}
.mic-btn.on .mi{animation:breathe 1.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.15)}}
.mic-btn.sm{min-height:40px;font-size:14px;padding:6px 14px 6px 8px}
.mic-btn.sm .mi{width:26px;height:26px}
.mic-btn.sm .mi svg{width:15px;height:15px}
.live{font-family:var(--f-learn);font-size:20px;color:var(--muted);min-height:1.5em}
.mic-err{font-size:15px;color:var(--r1)}
.result{background:var(--sea-deep);border-radius:16px;padding:14px 16px;display:grid;gap:10px;margin-top:4px}
.result .heard{font-family:var(--f-learn);font-size:22px;line-height:1.4}
.result .heard-label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.ck{font-size:14px;border-radius:8px;padding:3px 10px;border:1px solid var(--line)}
.ck.ok{background:color-mix(in srgb,var(--r3) 22%,transparent);border-color:var(--r3)}
.ck.no{background:color-mix(in srgb,var(--r2) 14%,transparent);border-color:var(--r2)}
.earn{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--pumpkin)}
.earn svg{width:30px;height:20px}
.diff{font-family:var(--f-learn);font-size:24px;line-height:1.5}
.diff .w{padding:0 3px;border-radius:4px}
.diff .w.hit{color:var(--r3)}
.diff .w.miss{color:var(--r1);text-decoration:underline wavy;text-underline-offset:5px}

/* 這段在做什麼：影片練習（抓單字、跟讀） */
.video-card{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:var(--sea-deep);border-radius:16px;padding:14px 18px;margin-bottom:16px}
.video-card b{font-family:var(--f-display);font-size:20px}
.catch{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.catch button{min-height:64px;border-radius:14px;border:2px dashed var(--line);background:var(--sea-deep);font-family:var(--f-learn);font-size:20px;font-weight:700;color:var(--ink)}
.catch button[aria-pressed="true"]{border-style:solid;border-color:var(--r3);background:color-mix(in srgb,var(--r3) 24%,var(--sea-deep))}
.shadow-text{font-family:var(--f-learn);font-size:clamp(24px,3vw,32px);line-height:1.4;font-weight:700;margin:6px 0 14px}
.add-lines{display:grid;gap:8px;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}

/* 這段在做什麼：角色扮演的對話泡泡 */
.door-head{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.door-pic{font-size:64px;line-height:1;background:var(--sea-deep);border-radius:18px;padding:10px 14px}
.door-who{font-family:var(--f-display);font-size:26px;font-weight:800}
.chat{display:grid;gap:12px}
.bubble{max-width:min(640px,92%);border-radius:18px;padding:12px 16px;display:grid;gap:8px}
.bubble .who-l{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bubble.n{background:var(--card-2);justify-self:start;border-bottom-left-radius:6px}
.bubble.n p{font-family:var(--f-learn);font-size:21px}
.bubble.s{background:var(--sea-deep);border:2px solid var(--pumpkin);justify-self:end;border-bottom-right-radius:6px}
.bubble .s-hint{font-family:var(--f-learn);font-size:19px;color:var(--moon)}
.bubble .line-res{font-family:var(--f-learn);font-size:18px}
.bubble .line-res.ok{color:var(--r3)}
.bubble .line-res.no{color:var(--r2)}
.bubble-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* 這段在做什麼：說故事的四格圖 */
.story-title{font-family:var(--f-display);font-size:20px;color:var(--moon);margin-bottom:10px}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.panel-mini{position:relative;border:1px solid var(--line);background:var(--sea-deep);border-radius:14px;padding:16px 6px;font-size:clamp(22px,3.4vw,36px);line-height:1;color:var(--ink)}
.panel-mini[aria-current="true"]{border:2px solid var(--pumpkin)}
.pm-n{position:absolute;top:6px;left:8px;font-size:12px;font-weight:800;color:var(--muted)}
.panel-big{display:grid;grid-template-columns:minmax(140px,240px) minmax(0,1fr);gap:22px;align-items:start}
.pb-scene{font-size:clamp(46px,7vw,76px);line-height:1.2;text-align:center;background:var(--sea-deep);border-radius:18px;padding:20px 8px;word-break:break-all}
.kw{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.kw-chip{font-family:var(--f-learn);font-size:18px;border:1px solid var(--line);border-radius:999px;padding:4px 14px}
.kw-chip.hit{background:var(--r3);color:var(--pumpkin-ink);border-color:transparent}
@media (max-width:620px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.panel-big{grid-template-columns:1fr}}

/* 這段在做什麼：老師評分區 */
.tutor{margin-top:16px;background:var(--sea-deep);border:1px dashed var(--line);border-radius:22px;padding:18px clamp(16px,3vw,26px);display:grid;gap:14px}
.tutor-head{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between}
.tutor-head h2{font-size:16px;letter-spacing:.06em;color:var(--moon)}
.suggest{font-size:14px;color:var(--muted)}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rate-btn{display:grid;gap:2px;justify-items:center;border-radius:14px;padding:10px 6px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.rate-btn .rb-zh{font-size:18px;font-weight:800}
.rate-btn .rb-en{font-size:12px;color:var(--muted)}
.rate-btn .rb-c{display:flex;gap:2px;color:var(--pumpkin)}
.rate-btn .rb-c svg{width:20px;height:13px}
.rate-btn.r1[aria-pressed="true"]{background:var(--r1);border-color:var(--r1);color:var(--pumpkin-ink)}
.rate-btn.r2[aria-pressed="true"]{background:var(--r2);border-color:var(--r2);color:var(--pumpkin-ink)}
.rate-btn.r3[aria-pressed="true"]{background:var(--r3);border-color:var(--r3);color:var(--pumpkin-ink)}
.rate-btn[aria-pressed="true"] .rb-en,.rate-btn[aria-pressed="true"] .rb-c{color:var(--pumpkin-ink)}
.flags{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flags .label{font-size:13px;color:var(--muted);font-weight:700;margin-right:4px}
.flag{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-size:14px;font-weight:650;color:var(--ink)}
.flag[aria-pressed="true"]{background:var(--r2);border-color:var(--r2);color:var(--pumpkin-ink)}
.tnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--card);border:1px solid var(--line);color:var(--muted)}

/* 這段在做什麼：右側滑出的「教材」面板 */
.drawer{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end}
.drawer-bg{position:absolute;inset:0;background:color-mix(in srgb,var(--sea-deep) 70%,transparent)}
.drawer-panel{position:relative;width:min(460px,100%);height:100%;overflow-y:auto;background:var(--card);border-left:1px solid var(--line);padding:20px max(18px,env(safe-area-inset-right,0px)) 40px 20px;display:grid;gap:16px;align-content:start}
.dp-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dp-head h2{font-family:var(--f-display);font-size:24px}
.mats{list-style:none;padding:0;display:grid;gap:10px}
.mat{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--sea-deep);border-radius:14px;padding:12px 14px}
.mat-kind{font-size:12px;font-weight:800;border-radius:6px;padding:2px 8px;background:var(--card-2);color:var(--moon);white-space:nowrap}
.mat a{font-weight:700;font-size:16px;word-break:break-word}
.mat-form{display:grid;gap:8px;background:var(--sea-deep);border-radius:14px;padding:14px}
.form-msg{font-size:14px;color:var(--r1);min-height:1.2em}

/* 這段在做什麼：下課報告（淺色紙卡，方便截圖給家長） */
.report-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.paper{color-scheme:light;background:var(--paper);color:var(--paper-ink);border-radius:20px;padding:clamp(20px,4vw,40px);max-width:880px;margin:0 auto;display:grid;gap:26px}
.paper .eyebrow{color:var(--paper-muted)}
.paper h1{font-family:var(--f-display);font-size:clamp(26px,3.6vw,36px);font-weight:800}
.paper h3{font-size:15px;letter-spacing:.06em;color:var(--paper-muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--paper-line)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--paper-muted);font-size:15px;margin-top:6px}
.score{display:flex;flex-wrap:wrap;gap:20px 36px;align-items:center}
.big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;color:var(--pumpkin);font-variant-numeric:tabular-nums}
.big small{font-size:22px;color:var(--paper-muted);margin-left:6px}
.badge{display:inline-block;background:var(--paper-ink);color:var(--paper);border-radius:999px;padding:6px 16px;font-family:var(--f-display);font-weight:700;font-size:18px}
.score-meta{display:grid;gap:4px;font-size:15px;color:var(--paper-muted)}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:7.5em minmax(0,1fr) 3em;gap:12px;align-items:center;font-size:15px}
.bar{height:12px;border-radius:6px;background:var(--paper-line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pumpkin);border-radius:6px}
.bar-row b{font-variant-numeric:tabular-nums;text-align:right}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--paper-line)}
.tbl th{font-size:12px;color:var(--paper-muted);letter-spacing:.06em}
.tbl td.num,.tbl th.num{text-align:right}
.list{list-style:none;padding:0;display:grid;gap:10px}
.list li{background:var(--paper-soft);border-radius:12px;padding:10px 14px}
.list .said{font-family:var(--f-learn);font-size:17px;margin-top:2px}
.list .fl{display:inline-block;font-size:12px;font-weight:700;background:var(--r2);border-radius:6px;padding:1px 8px;margin-left:6px}
.paper textarea{background:var(--paper-soft);border-color:var(--paper-line);color:var(--paper-ink)}
.paper .btn{background:var(--paper-soft);border-color:var(--paper-line);color:var(--paper-ink)}
.paper .btn.primary{background:var(--pumpkin);color:var(--pumpkin-ink);border-color:transparent}
.copy-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.copy-status{font-size:14px;color:var(--paper-muted)}
.copy-fallback{min-height:160px;font-size:13px}
.empty-note{color:var(--paper-muted);font-size:15px}

/* 這段在做什麼：成績港（所有報告列表） */
.hist{display:grid;gap:10px}
.hist-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.hist-row b{font-family:var(--f-display);font-size:18px}
.hist-pct{display:grid;gap:4px;font-variant-numeric:tabular-nums;font-size:14px}
.hist-pct .bar{background:var(--sea-deep)}
.hist-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted)}
.backup{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px;padding-top:16px;border-top:1px dashed var(--line)}
@media (max-width:700px){.hist-row{grid-template-columns:1fr}.hist-actions{justify-content:flex-start}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app" class="wrap"></div>

<script>
'use strict';

/* ==========================================================
   這段在做什麼：課程內容
   之後要加新課程，就照 halloween 的格式再加一份。
   kind 決定題目長怎樣：question 開放回答、word 單字、catch 抓單字、
   shadow 跟讀、dialogue 角色扮演、panel 看圖說故事
   ========================================================== */
const LESSONS = {
  halloween: {
    id: 'halloween', zone: 'festival',
    title: 'Halloween Night', zh: '萬聖夜口說課',
    level: 'CEFR A2・Cambridge Flyers', minutes: 60,
    goals: [
      '用 12 個萬聖節單字說出完整句子',
      '看懂一支英文影片，說出 3 個重點',
      '用 be going to 和過去式談計畫與經驗',
      '在 trick-or-treat 情境裡主動回應',
      '比較中元節和萬聖節的不同'
    ],
    assess: '學生按麥克風說話，電腦聽寫並給建議分數，老師可以改。每題 1–3 顆糖，下課自動算出六項能力分數。',
    aiPoint: '語音辨識即時聽寫學生的話，檢查單字、關鍵字和句型。下課後一鍵複製報告給 Claude，寫出家長評語。',
    video: {
      title: 'The history of Halloween',
      source: 'British Council LearnEnglish Kids',
      url: 'https://learnenglishkids.britishcouncil.org/listen-watch/video-zone/history-halloween'
    },
    stages: [
      {
        id: 'picture', kind: 'question', title: 'Picture Talk', zh: '看圖說說', minutes: 5,
        skills: ['ideas', 'fluency'], scene: true,
        intro: 'Look at the picture. Answer in full sentences.',
        items: [
          { id: 'p1', prompt: 'What can you see in the picture? Tell me three things.',
            hint: 'I can see a … / There is a … / There are some …',
            follow: 'Where is the bat? What is the cat doing?',
            expect: { minWords: 10, keywords: ['house','pumpkin','jack o lantern','bat','ghost','cat','moon','witch','vampire','spider','web','tree','candy'], needHits: 3 } },
          { id: 'p2', prompt: 'What are the children wearing?',
            hint: 'The girl is wearing a … costume. The boy is dressed as …',
            follow: 'Which costume do you like best? Why?',
            expect: { minWords: 8, keywords: ['witch','vampire','costume','hat','cape','wearing','dressed'], needHits: 2 } },
          { id: 'p3', prompt: 'How do you think the children feel? Why?',
            hint: 'I think they feel … because …',
            follow: 'Would you go into that house? Why or why not?',
            expect: { minWords: 8, because: true, keywords: ['happy','excited','scared','afraid','nervous','brave','fun','surprised'], needHits: 1 } }
        ]
      },
      {
        id: 'words', kind: 'word', title: 'Word Lab', zh: '單字實驗室', minutes: 10,
        skills: ['vocab', 'pron'],
        intro: 'Press the mic. Say the word, then make your own sentence.',
        items: [
          { id: 'costume', word: 'costume', pic: '🦸', pos: 'noun', zh: '變裝服', def: 'Clothes you wear to look like a different person or thing.', ex: "I'm wearing a superhero costume tonight." },
          { id: 'jack', word: "jack-o'-lantern", alt: ['jack o lantern','jackolantern','jack lantern'], pic: '🎃', pos: 'noun', zh: '南瓜燈', def: 'A pumpkin with a face cut into it and a light inside.', ex: "We put a jack-o'-lantern next to the front door." },
          { id: 'skeleton', word: 'skeleton', pic: '💀', pos: 'noun', zh: '骷髏、骨架', def: 'All the bones inside a body.', ex: "There's a plastic skeleton hanging on the door." },
          { id: 'witch', word: 'witch', pic: '🧙‍♀️', pos: 'noun', zh: '女巫', def: 'A woman in stories who can do magic.', ex: 'The witch flew over the moon on her broom.' },
          { id: 'broom', word: 'broom', pic: '🧹', pos: 'noun', zh: '掃帚', def: 'A brush with a long handle for cleaning the floor.', ex: 'Witches in stories ride on brooms.' },
          { id: 'vampire', word: 'vampire', pic: '🧛', pos: 'noun', zh: '吸血鬼', def: 'A monster in stories that sleeps in the day and wakes up at night.', ex: 'My brother dressed up as a vampire with long teeth.' },
          { id: 'bat', word: 'bat', pic: '🦇', pos: 'noun', zh: '蝙蝠', def: 'A small animal with wings that flies at night.', ex: 'Bats sleep upside down.' },
          { id: 'web', word: 'spider web', alt: ['spiderweb','cobweb'], pic: '🕸️', pos: 'noun', zh: '蜘蛛網', def: 'The thin net that a spider makes.', ex: "There's a big spider web in the corner." },
          { id: 'haunted', word: 'haunted house', alt: ['haunted'], pic: '🏚️', pos: 'noun', zh: '鬼屋', def: 'A house where people think ghosts live.', ex: 'Nobody wants to go into the haunted house.' },
          { id: 'spooky', word: 'spooky', pic: '👻', pos: 'adjective', zh: '陰森的、有點恐怖的', def: 'A little bit scary, often in a fun way.', ex: 'The music in this movie is so spooky!' },
          { id: 'decorate', word: 'decorate', pic: '🎀', pos: 'verb', zh: '裝飾', def: 'To make a place look pretty or special.', ex: 'We decorate our classroom with paper bats.' },
          { id: 'scream', word: 'scream', pic: '😱', pos: 'verb', zh: '尖叫', def: 'To shout very loudly because you are scared or excited.', ex: 'Everyone screamed when the lights went out.' }
        ]
      },
      {
        id: 'video', kind: 'question', title: 'Watch & Talk', zh: '影片練習', minutes: 15,
        skills: ['listening', 'ideas'], video: true,
        intro: 'Watch the video. Catch the words, then talk about it.',
        items: [
          { id: 'v1', prompt: 'This video is about the history of Halloween. What do you think you will learn?',
            hint: 'I think I will learn about … / Maybe Halloween started in …',
            follow: '看影片前問。猜錯沒關係，看完再對照。',
            expect: { minWords: 8, keywords: ['think','maybe','learn','started','began','ghosts','costumes','pumpkins','old','long ago'], needHits: 1 } },
          { id: 'v2', kind: 'catch', title: 'Word Catch 抓單字',
            prompt: 'While you watch, tap the words you hear.',
            words: ['Celts','Samhain','ghosts','fire','costumes','turnips','pumpkins','trick or treat','America','October'] },
          { id: 'v3', prompt: 'Where did Halloween start? How long ago?',
            hint: 'It started in … more than … years ago.',
            follow: '答案通常是：Celts、Samhain、兩千多年前。以影片內容為準。',

          { id: 'v4', prompt: 'Why did people wear costumes a long time ago?',
            hint: 'They wore costumes because they thought …',
            follow: '可以追問：Do people wear costumes for the same reason today?',
            expect: { minWords: 8, because: true, past: true, keywords: ['ghost','ghosts','spirit','spirits','scare','scary','hide','afraid','recognize','dead'], needHits: 1 } },
          { id: 'v5', prompt: 'What did people use before pumpkins? Why did that change?',
            hint: 'Before pumpkins, people used … In America, …',
            follow: '常見答案：turnips 蕪菁；移民到美國後改用南瓜。以影片內容為準。',
            expect: { minWords: 8, keywords: ['turnip','potato','beetroot','vegetable','america','pumpkin','bigger','easier'], needHits: 2 } },
          { id: 'v6', kind: 'shadow', text: 'Halloween started more than two thousand years ago.', skills: ['pron', 'listening'] },
          { id: 'v7', kind: 'shadow', text: 'People thought that ghosts came back on that night.', skills: ['pron', 'listening'] },
          { id: 'v8', kind: 'shadow', text: 'They wore costumes so the ghosts could not find them.', skills: ['pron', 'listening'] },
          { id: 'v9', prompt: 'Tell me three things you learned from the video.',
            hint: 'First, … Also, … Finally, …',
            follow: '鼓勵用 First / Also / Finally 串起來。',
            expect: { minWords: 15, past: true, keywords: ['celts','samhain','ghosts','spirits','fire','bonfire','costumes','turnips','pumpkins','america','candy','trick or treat','two thousand','october'], needHits: 3 } }
        ]
      },
      {
        id: 'street', kind: 'dialogue', title: 'Trick-or-Treat Street', zh: '不給糖就搗蛋街', minutes: 10,
        skills: ['fluency', 'pron'],
        intro: 'Knock on the doors. The teacher plays the neighbor. You play the trick-or-treater.',
        items: [
          { id: 'door1', who: 'Mrs. Green', pic: '🏡', mood: 'A friendly neighbor',
            lines: [
              { s: 'n', t: 'Hello there! Wow, look at you! What are you dressed as?' },
              { s: 's', t: "Trick or treat! I'm dressed as a ___.", expect: [['trick or treat'], ['im','i am','dressed']] },
              { s: 'n', t: "That's amazing! Did you make it yourself?" },
              { s: 's', t: 'Yes, I did. / No, my ___ made it for me.', expect: [['yes','no','did','made']] },
              { s: 'n', t: 'Would you like chocolate or gummy bears?' },
              { s: 's', t: '___, please. Thank you! Happy Halloween!', expect: [['please'], ['thank','thanks'], ['happy halloween']] }
            ] },
          { id: 'door2', who: 'Mr. Bones', pic: '💀', mood: 'A curious grandpa',
            lines: [
              { s: 'n', t: 'Trick or treat, eh? Answer my questions first! How many houses have you been to tonight?' },
              { s: 's', t: "We've been to ___ houses.", expect: [['been to','visited','went to','houses','house']] },
              { s: 'n', t: "And what's the best treat you've got so far?" },
              { s: 's', t: 'The best one is ___ because ___.', expect: [['best'], ['because','so']] },
              { s: 'n', t: "Don't eat it all tonight! Here you are." },
              { s: 's', t: "Thanks, Mr. Bones! I won't. Good night!", expect: [['thank','thanks'], ['wont','will not','good night']] }
            ] },
          { id: 'door3', who: 'The Haunted House', pic: '🏚️', mood: 'A spooky voice behind the door',
            lines: [
              { s: 'n', t: 'Whooo is knocking on my door? No candy, unless you answer my riddle! What has a face and two hands, but no arms or legs?' },
              { s: 's', t: "It's a clock!", expect: [['clock']] },
              { s: 'n', t: 'Correct! Now YOU tell ME a Halloween joke.' },
              { s: 's', t: "Why didn't the skeleton go to the party? Because he had no body to go with!", expect: [['skeleton'], ['party'], ['no body','nobody']] },
              { s: 'n', t: "Ha ha ha! That's terrible! Take two candies." }
            ] }
        ]
      },
      {
        id: 'interview', kind: 'question', title: 'Interview Time', zh: '訪問時間', minutes: 10,
        skills: ['ideas', 'grammar'],
        intro: 'Answer the questions. Give a reason every time.',
        items: [
          { id: 'i1', prompt: 'What are you going to be for Halloween this year? Why?',
            hint: "I'm going to be a … because …", follow: 'Who will help you make your costume?',
            expect: { minWords: 10, future: true, because: true } },
          { id: 'i2', prompt: 'What did you do last Halloween?',
            hint: 'Last Halloween, I went / wore / ate …', follow: 'Who were you with? Was it fun?',
            expect: { minWords: 10, past: true } },
          { id: 'i3', prompt: 'Do you like scary stories or movies? Why or why not?',
            hint: "I like / don't like … because …", follow: "What's the scariest story you know?",
            expect: { minWords: 10, because: true } },
          { id: 'i4', prompt: 'If you could design a haunted house, what would you put inside?',
            hint: 'I would put … in it, so people would …', follow: 'Would you let your friends in for free?',

          { id: 'i5', prompt: 'In Taiwan, we have Ghost Month. How is it different from Halloween?',
            hint: 'During Ghost Month, people … On Halloween, people …', follow: 'Which one do you like better? Why?',

        ]
      },
      {
        id: 'story', kind: 'panel', title: 'Story Time', zh: '說故事', minutes: 10,
        skills: ['grammar', 'fluency'], storyTitle: 'The House on Maple Street',

        items: [
          { id: 's1', scene: '🌕 🧙‍♀️ 🧛‍♂️ 🐈‍⬛', prompt: 'What happened first?',

          { id: 's2', scene: '🏚️ 🕸️ 🕯️', prompt: 'What did they see?',

          { id: 's3', scene: '🚪 💀 😱', prompt: 'What happened next?',

          { id: 's4', scene: '👴 🍬 😂', prompt: 'How did the story end?',

            model: 'It was Grandpa in a skeleton costume! Everyone laughed and shared the candy.' }
        ]
      },
      {
        id: 'exit', kind: 'question', title: 'Exit Ticket', zh: '下課小任務', minutes: 3,
        skills: ['vocab', 'ideas'],
        intro: 'Two quick questions before you go!',
        items: [
          { id: 'e1', prompt: 'Tell me three new words you learned today.',

function micControl({ owner, continuous, maxMs, small, label, onDone }) {
  const wrap = h('div', { class: 'mic' });
  const live = h('p', { class: 'live', 'aria-live': 'polite' });
  const err = h('p', { class: 'mic-err', 'aria-live': 'polite' });
  const btn = h('button', { class: 'mic-btn' + (small ? ' sm' : ''), type: 'button', 'data-mic': owner });

  const setIdle = () => { btn.classList.remove('on'); btn.replaceChildren(h('span', { class: 'mi' }, svg(ICON.mic)), idleLabel); };
  const setOn = () => { btn.classList.add('on'); btn.replaceChildren(h('span', { class: 'mi' }, svg(ICON.stop)), '聆聽中…說完按這裡'); };
  setIdle();
  if (!Speech.supported()) {

    err.textContent = '這個瀏覽器不支援語音辨識。請用 Chrome 打開，或由老師直接評分。';
    wrap.append(btn, err);
    return wrap;
  }
  btn.addEventListener('click', () => {
    if (Speech.rec && Speech.owner === owner) { Speech.stop(); return; }
    err.textContent = '';
    live.textContent = '';
    try { speechSynthesis.cancel(); } catch (e) { /* 忽略 */ }
    const ok = Speech.start({
      owner, continuous, maxMs,
      onInterim: t => { live.textContent = t; },
      onDone: r => { live.textContent = ''; onDone(r); },
      onError: code => { err.textContent = MIC_ERRORS[code] || '沒有辨識成功，再按一次試試。'; },

  });

  return wrap;

function reveal(label, content, k) {
  content.hidden = true;
  const btn = h('button', { class: 'btn small', type: 'button', 'aria-expanded': 'false' }, label);
  btn.addEventListener('click', () => {
    content.hidden = !content.hidden;
    btn.setAttribute('aria-expanded', String(!content.hidden));
    if (!content.hidden && k && !state.session.hints[k]) { state.session.hints[k] = true; saveDraft(); paintTutor(); }
  });
  return { btn, content };
}

/* 這段在做什麼：電腦聽完之後，顯示結果、自動給糖 */
function handleSpeech(k, text, alts, evaluate) {
  const s = state.session;
  const r = evaluate(text, alts);
  s.said[k] = text;
  s.evals[k] = r;
  s.stats.attempts++; s.stats.words += r.wc || 0;
  applyRating(k, r.rating);
}
function applyRating(k, rating) {
  const s = state.session, before = s.ratings[k] || 0;
  if (!s.manual[k]) s.ratings[k] = rating;
  saveDraft();
  paintCounter((s.ratings[k] || 0) > before);
  paintTabs(); paintDots(); paintTutor();
  const box = $('#res-' + CSS.escape(k)); if (box) box.replaceWith(resultBox(k));
}
function resultBox(k, opts = {}) {
  const s = state.session, said = s.said[k], ev = s.evals[k];
  const box = h('div', { class: 'result', id: 'res-' + k, hidden: !said && !opts.alwaysShow });
  if (!said || !ev) return box;
  box.append(h('p', { class: 'heard-label' }, '電腦聽到'));
  if (ev.diff) box.append(h('p', { class: 'diff' }, ev.diff.map(d => [h('span', { class: 'w ' + (d.hit ? 'hit' : 'miss') }, d.w), ' '])));
  else box.append(h('p', { class: 'heard' }, said));
  box.append(h('div', { class: 'checks' }, ev.chips.map(c => h('span', { class: 'ck ' + (c.ok ? 'ok' : 'no') }, (c.ok ? '✓ ' : '△ ') + c.text))));
  const r = s.ratings[k] || 0;
  if (r) box.append(h('p', { class: 'earn' }, candyRow(r), r === 3 ? 'Excellent! 拿到 3 顆糖' : r === 2 ? 'Good job! 拿到 2 顆糖' : 'Nice try! 再試一次可以拿更多'));
  return box;
}

/* ---------- 抓單字 ---------- */
function renderCatch(st, it, k) {
  const s = state.session;
  const caught = new Set(s.caught[k] || []);
  const status = h('p', { class: 'earn' });
  const paintStatus = () => {
    const r = s.ratings[k] || 0;
    status.replaceChildren(`抓到 ${caught.size} / ${it.words.length} 個字`, r ? candyRow(r) : '');
  };
  const grid = h('div', { class: 'catch' }, it.words.map((w, i) => {
    const b = h('button', { type: 'button', 'aria-pressed': String(caught.has(i)) }, w);
    b.addEventListener('click', () => {
      if (caught.has(i)) caught.delete(i); else caught.add(i);
      b.setAttribute('aria-pressed', String(caught.has(i)));
      s.caught[k] = [...caught];
      const ratio = caught.size / it.words.length;
      s.evals[k] = { rating: ratio >= 0.7 ? 3 : ratio >= 0.4 ? 2 : 1, chips: [{ ok: ratio >= 0.7, text: `抓到 ${caught.size} / ${it.words.length} 個字` }], wc: 0 };
      if (caught.size) applyRating(k, s.evals[k].rating);
      else { if (!s.manual[k]) delete s.ratings[k]; saveDraft(); paintCounter(false); paintTabs(); paintDots(); paintTutor(); }
      paintStatus();
    });
    return b;
  }));
  paintStatus();
  return h('div', null,
    videoCard(lessonOf(s)),
    h('p', { class: 'eyebrow' }, it.title),
    h('p', { class: 'prompt sm' }, it.prompt),
    grid, status,

      it.custom ? h('button', { class: 'linkish', type: 'button', onclick: () => removeShadowLine(it.id) }, '刪掉這一句') : null),

function addShadowLines(raw, msg) {
  const lines = String(raw || '').split(/\n+/).map(x => x.trim()).filter(x => x.length >= 3);
  if (!lines.length) { msg.textContent = '請先貼上句子。'; return; }
  const s = state.session, lid = s.lessonId;
  const store = state.settings.shadow[lid] || (state.settings.shadow[lid] = []);
  const firstNew = s.extra.length;
  lines.forEach(t => {
    if (s.extra.some(x => x.text === t)) return;
    const x = { id: 'x_' + newId(), text: t };
    s.extra.push(x);
    if (!store.some(y => y.text === t)) store.push({ id: x.id, text: t });
  });
  saveSettings(); saveDraft();
  const its = curItems();
  const idx = its.findIndex(i => s.extra[firstNew] && i.id === s.extra[firstNew].id);
  if (idx >= 0) state.itemIdx = idx;
  paintTabs(); paintStage(); paintTutor();
}
function removeShadowLine(id) {
  const s = state.session, lid = s.lessonId;
  s.extra = s.extra.filter(x => x.id !== id);
  state.settings.shadow[lid] = (state.settings.shadow[lid] || []).filter(x => x.id !== id);
  Object.keys(s.ratings).forEach(k => { if (k.endsWith('__' + id)) delete s.ratings[k]; });
  saveSettings(); saveDraft();
  state.itemIdx = Math.min(state.itemIdx, curItems().length - 1);
  paintLesson();
}

/* ---------- 角色扮演 ---------- */
function doorRating(it, k) {
  const s = state.session, lines = it.lines.map((l, i) => ({ l, i })).filter(x => x.l.s === 's');
  const tried = lines.filter(x => s.said[k + '#' + x.i]);
  if (!tried.length) return 0;
  const avg = tried.reduce((a, x) => a + (s.evals[k + '#' + x.i]?.ratio || 0), 0) / tried.length;
  return avg >= 0.85 && tried.length === lines.length ? 3 : avg >= 0.5 ? 2 : 1;
}
function renderDialogue(st, it, k) {
  const s = state.session;

  hintBtn.addEventListener('click', () => {
    s.hints[k] = true; saveDraft();
    $$('.s-hint').forEach(n => { n.hidden = false; });
    hintBtn.disabled = true; hintBtn.textContent = '已顯示學生台詞'; paintTutor();
  });
  const lines = it.lines.map((l, i) => {
    if (l.s === 'n') return h('div', { class: 'bubble n' }, h('span', { class: 'who-l' }, it.who), h('p', null, l.t), h('div', { class: 'bubble-row' }, speakBtn(l.t, '播放')));
    const lk = k + '#' + i;
    const res = h('p', { class: 'line-res', id: 'line-' + lk });
    const paintRes = () => {
      const said = s.said[lk], ev = s.evals[lk];

      res.textContent = said ? `${ev && ev.ratio >= 0.99 ? '✓' : '△'} 「${said}」${ev && ev.missing.length ? `（還少：${ev.missing.join('、')}）` : ''}` : '';
    };
    paintRes();
    return h('div', { class: 'bubble s' },
      h('span', { class: 'who-l' }, 'You'),
      h('p', { class: 's-hint', hidden: !shown }, l.t),
      h('div', { class: 'bubble-row' }, micControl({ owner: lk, small: true, continuous: false, maxMs: 15000, label: '換你說', onDone: r => {
        s.said[lk] = r.text;
        const e = evalLine(l, r.text);
        s.evals[lk] = e;
        s.stats.attempts++; s.stats.words += toks(r.text).length;
        s.said[k] = r.text;
        s.evals[k] = { rating: doorRating(it, k), chips: [], wc: 0 };
        paintRes();
        applyRating(k, doorRating(it, k));
      } })),
      res);
  });
  return h('div', null,
    h('div', { class: 'door-head' },
      h('div', { class: 'door-pic', 'aria-hidden': 'true' }, it.pic),

    h('div', { class: 'tools' }, hintBtn, h('span', { class: 'muted sm' }, '老師唸鄰居的台詞，學生按「換你說」回答。')),
    h('div', { class: 'chat' }, lines));
}

/* ---------- 老師評分區 ---------- */
function paintTutor() {
  const el = $('#tutor'); if (!el) return;
  const st = curStage(), it = curItem(), k = keyOf(st, it), s = state.session;
  const r = s.ratings[k] || 0, fl = s.flags[k] || [], b = s.bonus[k] || 0;
  const ev = s.evals[k];
  const note = h('input', { id: 'note-input', type: 'text', placeholder: '老師筆記：學生的好句子或常犯的錯（選填，會放進報告）', value: s.notes[k] || '' });
  note.addEventListener('input', () => { s.notes[k] = note.value; saveDraftSoon(); });
  const items = curItems(), last = state.stageIdx === lessonOf(s).stages.length - 1 && state.itemIdx === items.length - 1;
  const first = state.stageIdx === 0 && state.itemIdx === 0;
  el.replaceChildren(
    h('div', { class: 'tutor-head' },
      h('h2', null, '老師評分區'),
      h('span', { class: 'suggest' },
        ev && ev.rating ? (s.manual[k] ? `電腦建議 ${ev.rating} 顆，已用老師的分數` : `目前是電腦建議的分數，按下面可以改`) : '學生說完會自動給建議分數；也可以直接按',
        '・鍵盤：1 / 2 / 3 評分、M 開麥克風、← → 換題')),
    h('div', { class: 'rate' }, RATINGS.map(R => h('button', { class: 'rate-btn r' + R.v, type: 'button', 'aria-pressed': String(r === R.v), onclick: () => setManual(k, R.v) },
      h('span', { class: 'rb-zh' }, R.zh), h('span', { class: 'rb-en' }, `${R.en}・按 ${R.v}`), candyRow(R.v)))),
    h('div', { class: 'flags' }, h('span', { class: 'label' }, '要加強'),
      Object.entries(FLAGS).map(([id, F]) => h('button', { class: 'flag', type: 'button', 'aria-pressed': String(fl.includes(id)), onclick: () => toggleFlag(k, id) }, F.zh))),
    note,
    h('div', { class: 'tnav' },
      h('button', { class: 'btn small', type: 'button', onclick: () => addBonus(k) }, b ? `+1 加分（已加 ${b}）` : '+1 加分'),
      s.hints[k] ? h('span', { class: 'pill' }, '有看提示') : null,
      h('span', { class: 'spacer' }),
      h('button', { class: 'btn small', type: 'button', disabled: first, onclick: prevItem }, '← 上一題'),
      last ? confirmBtn('完成，產生報告', '確定結束？', 'btn primary', endLesson)
           : h('button', { class: 'btn primary', type: 'button', onclick: nextItem }, '下一題 →')));
}
function setManual(k, v) {
  const s = state.session, before = s.ratings[k] || 0;
  if (s.ratings[k] === v && s.manual[k]) { delete s.ratings[k]; delete s.manual[k]; }
  else { s.ratings[k] = v; s.manual[k] = true; }
  saveDraft(); paintCounter((s.ratings[k] || 0) > before); paintTabs(); paintDots(); paintTutor();
  const box = $('#res-' + CSS.escape(k)); if (box) box.replaceWith(resultBox(k));
}
function toggleFlag(k, id) {
  const s = state.session, fl = new Set(s.flags[k] || []);
  if (fl.has(id)) fl.delete(id); else fl.add(id);
  s.flags[k] = [...fl]; if (!fl.size) delete s.flags[k];
  saveDraft(); paintTutor();
}
function addBonus(k) {
  const s = state.session; s.bonus[k] = Math.min(3, (s.bonus[k] || 0) + 1);
  saveDraft(); paintCounter(true); paintTutor();
}
function nextItem() {
  const items = curItems(), stages = lessonOf(state.session).stages;
  if (state.itemIdx < items.length - 1) state.itemIdx++;
  else if (state.stageIdx < stages.length - 1) { state.stageIdx++; state.itemIdx = 0; }
  else return;
  Speech.abort(); saveDraft(); paintTabs(); paintStage(); paintTutor(); $('#stage').scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function prevItem() {
  if (state.itemIdx > 0) state.itemIdx--;
  else if (state.stageIdx > 0) { state.stageIdx--; state.itemIdx = curItems().length - 1; }
  else return;
  Speech.abort(); saveDraft(); paintTabs(); paintStage(); paintTutor();
}
function confirmBtn(label, armedLabel, cls, onConfirm) {
  const b = h('button', { class: cls, type: 'button' }, label);
  let armed = false, t = null;
  b.addEventListener('click', () => {
    if (!armed) {
      armed = true; b.textContent = armedLabel; b.classList.add('armed');
      t = setTimeout(() => { armed = false; b.textContent = label; b.classList.remove('armed'); }, 4000);
    } else { clearTimeout(t); onConfirm(); }
  });
  return b;
}

/* 這段在做什麼：上課計時（只算畫面開著的時間） */
function startTimer() { stopTimer(); lastTick = Date.now(); timerId = setInterval(tick, 1000); tick(); }
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function tick() {
  const now = Date.now(), dt = now - lastTick; lastTick = now;
  if (state.session && dt < 60000) state.session.activeMs = (state.session.activeMs || 0) + dt;
  const t = $('#timer'); if (t && state.session) t.textContent = fmtClock(state.session.activeMs);
  if (++tickCount % 15 === 0) saveDraft();
}

/* 這段在做什麼：鍵盤快捷鍵（方便老師用筆電操作） */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.drawer) { state.drawer = false; paintDrawer(); return; }
  if (state.view !== 'lesson' || state.drawer) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (['1', '2', '3'].includes(e.key)) { setManual(curKey(), Number(e.key)); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { nextItem(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { prevItem(); e.preventDefault(); }
  else if (e.key === 'm' || e.key === 'M') { const b = $('#stage .mic-btn:not(:disabled)'); if (b) { b.click(); e.preventDefault(); } }
});

/* ==========================================================
   這段在做什麼：教材面板（影片、Twinkl、自己加的連結）
   ========================================================== */
function lessonMaterials(lid) {
  const L = LESSONS[lid], hidden = new Set(state.settings.hidden[lid] || []);
  return [
    ...L.materials.filter(m => !hidden.has(m.id)).map(m => Object.assign({ builtin: true }, m)),
    ...(state.settings.custom[lid] || []).map(m => Object.assign({ builtin: false }, m))
  ];
}
function paintDrawer() {
  const old = $('#drawer'); if (old) old.remove();
  if (!state.drawer || state.view !== 'lesson' || !state.session) return;
  const lid = state.session.lessonId, L = LESSONS[lid], list = lessonMaterials(lid);
  const hiddenN = (state.settings.hidden[lid] || []).length;
  const kind = h('select', { id: 'mat-kind' }, MAT_KINDS.map(k => h('option', { value: k }, k)));
  const title = h('input', { id: 'mat-title', type: 'text', placeholder: '例如：Room on the Broom 動畫' });
  const url = h('input', { id: 'mat-url', type: 'url', placeholder: 'https://' });
  const msg = h('p', { class: 'form-msg', 'aria-live': 'polite' });
  const add = () => {
    const t = title.value.trim(), u = url.value.trim();
    if (!t) { msg.textContent = '請填標題。'; title.focus(); return; }
    if (!/^https?:\/\/\S+$/i.test(u)) { msg.textContent = '網址要以 https:// 開頭。'; url.focus(); return; }

function endLesson() {
  const s = state.session; if (!s) return;
  Speech.abort();
  s.endedAt = Date.now();
  s.summary = summarize(s);
  s.updatedAt = Date.now();
  state.sessions = state.sessions.filter(x => x.id !== s.id).concat([s]);
  saveSessions();
  LS.del('draft:' + s.studentId);
  state.reportId = s.id; state.session = null; state.drawer = false;
  go('report');
}
function levelTitle(pct, rated) {
  if (!rated) return '尚未評分';
  if (pct >= 90) return 'Halloween Legend 萬聖傳奇';
  if (pct >= 75) return 'Spooky Star 驚喜之星';
  if (pct >= 60) return 'Brave Explorer 勇敢探險家';
  return 'Little Ghost 小幽靈，繼續加油';
}
function computeReport(s) {
  const L = lessonOf(s), dims = {};
  DIMS.forEach(d => { dims[d.id] = { sum: 0, n: 0 }; });
  let earned = 0, max = 0, bonus = 0, rated = 0, total = 0, hints = 0;
  const highlights = [], work = [];
  const stages = L.stages.map(st => {
    let e = 0, m = 0, b = 0, r = 0;
    const its = itemsOf(st, s);
    its.forEach((it, idx) => {
      total++;
      const k = keyOf(st, it), v = s.ratings[k], fl = s.flags[k] || [];
      b += s.bonus[k] || 0;
      if (s.hints[k]) hints++;
      const skills = it.skills || st.skills;
      if (v) { e += v; m += 3; r++; skills.forEach(d => { dims[d].sum += v; dims[d].n++; }); }
      fl.forEach(f => { const d = FLAGS[f].dim; dims[d].sum += 1; dims[d].n++; });
      const entry = { label: itemLabel(st, it, idx), stage: st.zh, said: s.said[k] || '', note: (s.notes[k] || '').trim(), flags: fl.map(f => FLAGS[f].zh) };
      if (v === 3) highlights.push(entry);
      if (v === 1 || fl.length) work.push(entry);
    });
    earned += e; max += m; bonus += b; rated += r;
    return { id: st.id, title: st.title, zh: st.zh, earned: e, max: m, bonus: b, rated: r, count: its.length };
  });
  const pct = max ? Math.round(earned / max * 100) : 0;
  return {
    earned, max, bonus, candies: earned + bonus, pct, rated, total, hints, stages, highlights, work,
    dims: DIMS.map(d => ({ id: d.id, zh: d.zh, en: d.en, score: dims[d.id].n ? Math.round(dims[d.id].sum / dims[d.id].n / 3 * 50) / 10 : null })),
    title: levelTitle(pct, rated),
    attempts: (s.stats && s.stats.attempts) || 0, words: (s.stats && s.stats.words) || 0
  };
}
function summarize(s) { const R = computeReport(s); return { pct: R.pct, candies: R.earned, bonus: R.bonus, max: R.max, title: R.title, rated: R.rated, total: R.total }; }

async function copyText(text, statusEl, host, okMsg) {
  try { await navigator.clipboard.writeText(text); statusEl.textContent = okMsg; host.replaceChildren(); }
  catch (e) {
    const ta = h('textarea', { class: 'copy-fallback', id: 'copy-fallback', readonly: true }); ta.value = text;
    host.replaceChildren(ta); ta.focus(); ta.select();
    statusEl.textContent = '沒辦法自動複製。文字已經選好了，請按 Ctrl+C（Mac 按 ⌘C）。';
  }
}
function reportText(s, R) {
  const L = lessonOf(s);

    R.dims.filter(d => d.score != null).map(d => `${d.zh} ${d.score.toFixed(1)}`).join('｜')
  ];

  if (R.work.length) { out.push('', '下次加強'); R.work.slice(0, 4).forEach(x => out.push(`・${x.label}${x.flags.length ? `（${x.flags.join('、')}）` : ''}`)); }

}
function claudePrompt(s, R) {

<task>根據下面的上課紀錄，寫三段文字：給家長的中文評語、給學生的英文鼓勵、下次上課建議。</task>

<context>
學生：${s.studentName}，小學五年級，程度中上（有上全英文補習班）。
課程：${L.title}（${L.zh}），口說課，程度 ${L.level}，上課 ${fmtMin(s.activeMs)}。
分數：每題 1–3 顆糖（1 再練練、2 不錯、3 很棒）。學生說的話是電腦語音辨識聽寫的，可能有辨識錯誤。
總分：${R.earned} / ${R.max}（${R.pct}%），完成 ${R.rated} / ${R.total} 題，看提示 ${R.hints} 次，開口 ${R.attempts} 次、共 ${R.words} 個英文字。
能力分數（滿分 5）：${R.dims.map(d => `${d.zh} ${d.score ?? '無資料'}`).join('、')}
老師已經寫的評語：${(s.teacherNote || '').trim() || '（無）'}

上課紀錄：
${lines.join('\n')}
</context>

<constraint>
- 中文用繁體、台灣用語，語氣溫暖專業，不浮誇，不要堆驚嘆號。
- 要具體：引用 1–2 句學生真的說過的英文。
- 只提 1 個最重要的改進點，不要列一長串缺點。
- 電腦聽寫可能有誤，不要因為單一個字辨識錯就判斷發音有問題。
</constraint>

<output_format>
【給家長】90–140 字
【To ${s.studentName}】2–3 句簡單英文（A2 程度）
【下次上課】3 點，每點 25 字以內
</output_format>`;
}

function exportBackup() {
  const data = { app: 'english-isle', version: 1, exportedAt: new Date().toISOString(), roster: state.roster, sessions: state.sessions, settings: state.settings };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: `english-isle-backup-${ymd()}.json` });
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function importBackup(file, msg) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      if (d.app !== 'english-isle') throw new Error('not ours');
      const merge = (a, b) => { const m = new Map(); [...a, ...b].forEach(x => { if (x && x.id) { const c = m.get(x.id); if (!c || (x.updatedAt || 0) >= (c.updatedAt || 0)) m.set(x.id, x); } }); return [...m.values()]; };
      state.roster = merge(state.roster, d.roster || []);
      state.sessions = merge(state.sessions, d.sessions || []);
      if (d.settings) state.settings = Object.assign({}, d.settings, state.settings);
      saveRoster(); saveSessions(); saveSettings();
      render();
      const m2 = $('[aria-live]', $('.backup')); if (m2) m2.textContent = `匯入完成：${(d.sessions || []).length} 份報告。`;
    } catch (e) { msg.textContent = '這個檔案不是英語島的備份。'; }
  };
  fr.readAsText(file);
}
